name: Build Android APK

on:
  push:
    branches: [App]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install

      - name: Build static pages and prepare www/
        run: npm run www

      - name: Add Android platform (if android/ is not committed)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Generate launcher icons and splash screens
        run: npx @capacitor/assets generate --android --assetPath resources --iconBackgroundColor '#0b1424' --splashBackgroundColor '#0b1424'

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Set version (versionCode = run number)
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version")
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle
          grep -nE "versionCode|versionName" android/app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WorldTales-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # ---- Signed release APK (only if signing secrets are configured) ----
      - name: Build release APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          UNSIGNED="$(ls android/app/build/outputs/apk/release/*-unsigned.apk | head -1)"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign \
            --ks release.keystore \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
            --out WorldTales-release.apk aligned.apk
          "$BT/apksigner" verify WorldTales-release.apk
          rm -f release.keystore

      - name: Upload release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: WorldTales-release-apk
          path: WorldTales-release.apk

      # ---- Publish a GitHub Release when a tag like v2.0.0 is pushed ----
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            WorldTales-release.apk
          fail_on_unmatched_files: false
